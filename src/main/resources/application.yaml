server:
  port: 8081
spring:
  application:
    name: qingxiang
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/qingxiang?useSSL=false&serverTimezone=UTC
    username: root
    password: root
  redis:
    host: 192.168.146.145
    port: 6379
    password: 123321
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.qingxiang.entity # 别名扫描包
# Knife4j API 文档配置（大厂标准：所有接口必须有在线文档，方便前后端联调和新人接⼿）
# 访问地址：http://localhost:8081/doc.html
knife4j:
  enable: true
  setting:
    language: zh-CN

logging:
  level:
    com.qingxiang: debug